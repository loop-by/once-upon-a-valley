<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#192439">
  <meta name="description" content="눈 내리는 겨울 마을에서 두 사람의 결혼 초대장을 열어 보세요.">
  <meta property="og:title" content="Once Upon a Valley · 겨울 마을의 결혼식">
  <meta property="og:description" content="눈길 끝에서 편지 한 통이 기다리고 있어요. 두 사람의 결혼식에 초대합니다.">
  <meta property="og:image" content="https://loop-by.github.io/once-upon-a-valley/assets/invitation-preview-bouquet.png?v=4">
  <meta property="og:image:alt" content="노을 지는 겨울 마을에서 신랑과 빨간 장미를 든 신부가 손을 맞잡은 픽셀 그림">
  <title>Once Upon a Valley · 겨울 마을의 초대장</title>
  <link rel="stylesheet" href="style.css?v=18">
  <script src="effects.js?v=6" defer></script>
  <script src="rsvp.js?v=4" defer></script>
  <script src="quest.js?v=19" defer></script>
</head>
<body>
  <header>
    <b><i>✦</i> 별빛 마을의 결혼식</b>
    <button type="button" id="sound" aria-label="배경음악 및 효과음" aria-pressed="false">♪ 음악 꺼짐</button>
  </header>
  <main>
    <section class="scene" aria-label="겨울 마을 결혼 퀘스트">
      <div class="landscape">
        <div class="hud"><span>❄　겨울 · 1월</span><span id="place">별빛 마을</span></div>
        <button class="keepsake" id="keepsake"><img src="assets/opened.png" alt="">예식 정보</button>
        <div class="title"><h1>Once Upon a Valley</h1></div>
        <div id="snow" aria-hidden="true"></div>
        <img class="villagers" id="villagers" src="assets/village-couple-bouquet.png?v=4" alt="턱시도를 입은 신랑과 웨딩 베일을 쓴 신부가 손을 맞잡고, 신부가 빨간 장미 한 송이를 든 픽셀 그림">
        <div id="item"></div>
        <article id="paper" hidden>
          <small>소중한 당신에게</small><h2>우리, 결혼해요!</h2>
          <p>이번 겨울, 우리가 부부가 돼요. 그 날 고개를 들었을 때 당신 얼굴이 보이면 참 좋겠어요.</p>
          <p class="signature" id="signature"></p>
        </article>
      </div>
      <div class="quest"><span id="quest-label">✦　퀘스트</span><strong id="objective"></strong><small id="count"></small></div>
      <section class="dialog">
        <figure><img src="assets/couple.png?v=3" alt=""><span id="mood" aria-hidden="true"></span></figure>
        <div class="conversation">
          <small id="speaker"></small><h2 id="speech" tabindex="-1"></h2>
          <div id="content"></div><div id="actions"></div>
        </div>
      </section>
    </section>
    <audio id="background-music" src="assets/audio/wedding-theme.mp3" loop preload="none"></audio>
  </main>
  <dialog id="music-prompt" aria-labelledby="music-title">
    <h2 id="music-title">배경음악을 켤까요?</h2>
    <div class="music-choices">
      <button type="button" id="music-on">♫ 음악 켜기</button>
      <button type="button" id="music-off">소리 없이 보기</button>
    </div>
  </dialog>
  <dialog id="letter-book" aria-labelledby="book-title">
    <h2 id="book-title"></h2><div id="book-details"></div>
    <form method="dialog"><button>대화로 돌아가기</button></form>
  </dialog>
</body>
</html>
